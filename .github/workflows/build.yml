name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\RutaiModManager.sln

jobs:
  loader:
    name: Rutai Mod Loader
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip

    - name: Build
      working-directory: RutaiModLoader
      run: make

    - uses: actions/upload-artifact@v4
      with:
        name: RutaiModLoader
        path: RutaiModLoader/build/RutaiModLoader.dll

  build:
    name: ${{matrix.configuration}}
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v3.3.0

    - name: Add Git hash to resources
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: echo ${{github.sha}} > RutaiModManager/Resources/Version.txt

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{matrix.configuration}} ${{env.SOLUTION_FILE_PATH}}

    - uses: actions/upload-artifact@v4
      with:
        name: RutaiModManager-${{matrix.configuration}}
        path: ${{github.workspace}}\RutaiModManager\bin\${{matrix.configuration}}\net472
